# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: excellent-os
description: GNOME workstation on secureblue.
base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: latest

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # desktop (base image already has GNOME, Nautilus and GNOME Disks)
        - jetbrains-mono-fonts
        - mpv
        - rsms-inter-fonts
        - transmission-gtk
        # shell and CLI
        - btop
        - eza
        - fastfetch
        - fd-find
        - rclone
        - ripgrep
        - sqlite
        - zoxide
        - zsh
        - zsh-syntax-highlighting
        # development (base image already has gcc, make, bzip2 and patch)
        - cmake
        - gcc-c++
        - postgresql
        - postgresql-server
        - ruby
        # ruby-build compiles Ruby, and the pg gem links against libpq
        - autoconf
        - gdbm-devel
        - libffi-devel
        - libpq-devel
        - libyaml-devel
        - ncurses-devel
        - openssl-devel
        - perl-FindBin
        - readline-devel
        - rust
        - zlib-devel

  # COPR repo file, because secureblue's os-release makes `dnf copr` look for secureblue chroots
  - type: dnf
    repos:
      cleanup: true
      files:
        - scottames-ghostty.repo
    install:
      install-weak-deps: false
      packages:
        - ghostty

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - proton-vpn.sh
      - ssh-agent.sh
      - xwayland.sh

  - type: justfiles

  - type: signing

  - type: script
    scripts:
      - image-key.sh
