# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: excellent-os
description: Sway workstation on secureblue.
base-image: ghcr.io/secureblue/sericea-main-hardened
image-version: latest

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # sway desktop (base image already has Thunar, foot, grim, slurp, pavucontrol, xarchiver and the portals)
        - gcr
        - gnome-disk-utility
        - jetbrains-mono-fonts
        - noctalia
        - rsms-inter-fonts
        - transmission-gtk
        # shell and CLI
        - eza
        - fastfetch
        - fd-find
        - gitleaks
        - glab
        - hcloud
        - rclone
        - ripgrep
        - ruff
        - trivy
        - uv
        - yt-dlp
        - zoxide
        - zsh
        - zsh-syntax-highlighting
        # development (base image already has gcc, make, bzip2 and patch)
        - cmake
        - gcc-c++
        - postgresql
        - postgresql-server
        - rbenv
        - ruby
        - ruby-build
        # ruby-build compiles Ruby, and the pg gem links against libpq
        - autoconf
        - gdbm-devel
        - libffi-devel
        - libpq-devel
        - libyaml-devel
        - ncurses-devel
        - openssl-devel
        - perl-FindBin
        - readline-devel
        - rust
        - zlib-devel
    # sway-config-fedora requires waybar, swaybg, swayidle, swaylock and lxqt-policykit, so they stay installed but unused
    remove:
      packages:
        - blueman
        - dunst
        - network-manager-applet

  # COPR repo files, because secureblue's os-release makes `dnf copr` look for secureblue chroots
  - type: dnf
    repos:
      cleanup: true
      files:
        - scottames-ghostty.repo
        - swayfx-swayfx.repo
    install:
      install-weak-deps: false
      packages:
        - ghostty
    # swayfx provides sway, so sway-config-fedora and the session stay intact
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:swayfx:swayfx
        packages:
          - old: sway
            new: swayfx

  # Repos are only needed while building; the system updates as a whole image
  - type: dnf
    repos:
      cleanup: true
      files:
        - brave-browser-beta.repo
        - claude-code.repo
    install:
      install-weak-deps: false
      packages:
        - brave-origin-beta
        - claude-code

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - proton-vpn.sh
      - ssh-agent.sh
      - xwayland.sh

  - type: justfiles

  - type: signing
