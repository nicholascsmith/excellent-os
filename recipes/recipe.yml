# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: excellent-os
description: Sway workstation on secureblue.
base-image: ghcr.io/secureblue/sericea-main-hardened
image-version: latest

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # sway desktop
        - Thunar
        - brightnessctl
        - foot
        - gcr
        - gnome-disk-utility
        - grim
        - jetbrains-mono-fonts
        - noctalia
        - pavucontrol
        - rsms-inter-fonts
        - slurp
        - transmission-gtk
        - unrar
        - xarchiver
        - xdg-desktop-portal
        - xdg-desktop-portal-wlr
        # shell and CLI
        - ImageMagick
        - bash-completion
        - eza
        - fastfetch
        - fd-find
        - gitleaks
        - glab
        - hcloud
        - jq
        - rclone
        - ripgrep
        - ruff
        - shfmt
        - trivy
        - uv
        - yt-dlp
        - zoxide
        - zsh
        - zsh-syntax-highlighting
        # development
        - cmake
        - gcc
        - gcc-c++
        - make
        - postgresql
        - postgresql-server
        - rbenv
        - ruby
        - ruby-build
        # ruby-build compiles Ruby, and the pg gem links against libpq
        - autoconf
        - bzip2
        - gdbm-devel
        - libffi-devel
        - libpq-devel
        - libyaml-devel
        - ncurses-devel
        - openssl-devel
        - patch
        - perl-FindBin
        - readline-devel
        - rust
        - zlib-devel
    # sway-config-fedora requires waybar, swaybg, swayidle, swaylock and lxqt-policykit, so they stay installed but unused
    remove:
      packages:
        - blueman
        - dunst
        - network-manager-applet

  - type: dnf
    repos:
      copr:
        - scottames/ghostty
        - swayfx/swayfx
    install:
      install-weak-deps: false
      packages:
        - ghostty
    # swayfx provides sway, so sway-config-fedora and the session stay intact
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:swayfx:swayfx
        packages:
          - old: sway
            new: swayfx

  - type: dnf
    repos:
      files:
        - brave-browser-beta.repo
        - claude-code.repo
        - protonvpn-stable.repo
    install:
      install-weak-deps: false
      packages:
        - brave-origin-beta
        - claude-code

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - proton-vpn.sh
      - ssh-agent.sh
      - xwayland.sh

  - type: justfiles

  - type: signing
